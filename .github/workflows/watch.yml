name: openworld-stock-watch

on:
  workflow_dispatch:  # 只保留手动触发，由 Cloudflare Workers 定时调用

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 缓存浏览器内核, 不用每轮都下载
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      # 恢复上轮保存的 cookie(免得每轮都重新登录)
      - name: Restore cookies
        uses: actions/cache/restore@v4
        with:
          path: cookies.json
          key: openworld-cookies
          restore-keys: openworld-cookies-

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium || playwright install --with-deps chromium

      - name: Run stock check
        env:
          OPENWORLD_EMAIL: ${{ secrets.OPENWORLD_EMAIL }}
          OPENWORLD_PASSWORD: ${{ secrets.OPENWORLD_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OPENWORLD_COOKIES: ${{ secrets.OPENWORLD_COOKIES }}
        run: python openworld_grab.py

      # 保存本轮 cookie, 供下轮复用
      - name: Save cookies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cookies.json
          key: openworld-cookies-${{ github.run_id }}

      # 出错时上传截图, 方便看是哪一步挂了
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: "*.png"
          retention-days: 3

      # 清理旧运行记录, 只保留最近 10 条
      - name: Cleanup old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api "repos/gxjxzgx/openworld-gh/actions/runs?per_page=100" --jq '.workflow_runs[].id' | \
          tail -n +11 | xargs -I{} gh api -X DELETE "repos/gxjxzgx/openworld-gh/actions/runs/{}" || true
